[project]
name = "smart-student-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3",
    "PyMySQL>=1.1",
    "cryptography>=42",
    "dj-database-url>=2.2",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.8",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "requests>=2.31",
]

[tool.vercel.scripts]
build = "python build.py"
