<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Student AI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Smart Student AI</a>
    <ul class="navbar-nav me-auto flex-row gap-3">
      <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Ask AI</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Student Directory</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'student_add' %}">Add Student</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'import_excel' %}">Import Excel</a></li>
    </ul>
    {% if request.user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="d-flex">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
      </form>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
