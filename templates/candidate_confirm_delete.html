{% extends "base.html" %}
{% block title %}Delete candidate | Smart Office AI{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4">Delete candidate?</h1>
    <p>Remove <strong>{{ candidate.full_name }}</strong> and their candidate record?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Delete candidate</button>
      <a class="btn btn-outline-secondary" href="{% url 'candidate_list' %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
