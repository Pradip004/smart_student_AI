{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="mb-3">{{ title }}</h4>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3 {% if field.name == 'fees_paid' %}form-check{% endif %}">
          {% if field.name == 'fees_paid' %}
            {{ field }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {% else %}
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
          {% endif %}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" href="{% url 'dashboard' %}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
